<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d12"><title>GYM TIMER</title><meta name="description" content="筋トレ・インターバル用タイマー"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="GYM TIMER"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f5f8;background:#090c11}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#202630,#090c11 65%);min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:22px 18px 38px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(26px,8vw,38px);letter-spacing:.1em;margin:0;font-weight:900;text-shadow:0 2px 12px #000}header small{color:#87909e;letter-spacing:.24em;font-size:10px}.panel{background:linear-gradient(145deg,#1c222b,#10151c);border:1px solid #333d49;border-radius:20px;padding:18px;box-shadow:inset 0 1px #ffffff15,0 10px 25px #0005;margin-bottom:17px}.label{color:#aab3c0;font-size:13px;font-weight:700;letter-spacing:.08em}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{min-width:0}.field input{margin-top:8px;width:100%;background:#090d13;color:white;border:1px solid #45505d;border-radius:10px;padding:12px 5px;text-align:center;font-size:23px;font-weight:800;outline:none}.field input:focus{border-color:#ff861d}.field small{font-size:10px;color:#818b99}.dial{width:min(85vw,390px);aspect-ratio:1;border-radius:50%;margin:25px auto 20px;padding:14px;background:conic-gradient(#ff7b10 var(--progress,100%),#313b48 0);box-shadow:0 0 35px #ff730018,0 15px 30px #0008;transition:background .2s linear}.dial-inner{height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#18202a,#080b10 70%);border:10px solid #0d1218;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase{font-weight:900;color:#ff8b25;font-size:clamp(18px,5vw,26px)}.time{font-size:clamp(65px,17vw,92px);letter-spacing:-.055em;line-height:1.2;font-weight:900;font-variant-numeric:tabular-nums}.set{color:#9da8b7;font-weight:800;font-size:20px}.set b{color:#ff851b;font-size:30px}.status{text-align:center;color:#a8b1bc;font-size:13px;margin-bottom:20px;min-height:20px}.actions{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}.btn{border:1px solid #46515d;border-radius:15px;min-height:64px;background:linear-gradient(#252d37,#131920);color:#f6f7f9;font-size:15px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(#ff9b25,#e24b00);border-color:#ffae55;color:#fff;box-shadow:0 6px 20px #ff5b003d;font-size:19px}.btn:active{transform:scale(.98)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;color:#bdc5d0;font-size:14px}.row input[type=checkbox]{accent-color:#ff821a;width:21px;height:21px}.row input[type=range]{accent-color:#ff821a;width:140px}.note{font-size:12px;color:#86909e;line-height:1.65;margin-top:15px}footer{text-align:center;color:#5e6977;font-size:11px;margin-top:20px}
</style></head><body><main class="wrap"><header><h1>GYM TIMER</h1><small>TRAIN HARDER · BE STRONGER</small></header><section class="panel"><div class="label">⚙ トレーニング設定</div><div class="settings" style="margin-top:14px"><label class="field"><small>運動時間（秒）</small><input id="work" type="number" min="1" max="3600" value="40" inputmode="numeric"></label><label class="field"><small>休憩時間（秒）</small><input id="rest" type="number" min="0" max="3600" value="20" inputmode="numeric"></label><label class="field"><small>セット数</small><input id="sets" type="number" min="1" max="99" value="5" inputmode="numeric"></label></div></section><section class="dial" id="dial"><div class="dial-inner"><div class="phase" id="phase">READY</div><div class="time" id="time">00:40</div><div class="set">SET <b id="current">1</b> / <span id="total">5</span></div></div></section><div class="status" id="status" aria-live="polite">スタートを押して開始</div><div class="actions"><button class="btn" id="reset">↻<br>リセット</button><button class="btn primary" id="start">▶ スタート</button><button class="btn" id="skip">⏭<br>スキップ</button></div><section class="panel" style="margin-top:20px"><div class="label">🔊 通知設定</div><label class="row">通知音を鳴らす <input id="sound" type="checkbox" checked></label><label class="row">終了3秒前のカウント音 <input id="countdown" type="checkbox" checked></label><label class="row">音量 <input id="volume" type="range" min="0" max="100" value="65"></label><p class="note">※ iPhoneでは消音モード・音量設定・画面ロックなどにより音が鳴らない場合があるで。確実に使うなら画面を開いたままにしてな。</p></section><footer>GYM TIMER · PWA</footer></main><script>
(()=>{const $=id=>document.getElementById(id),ids=['work','rest','sets','sound','countdown','volume'];let phase='ready',set=1,remaining=40,deadline=0,interval=null,running=false,ctx=null,prev=null,wake=null;const num=(id,min,max)=>Math.min(max,Math.max(min,Number($(id).value)||min));function config(){return{work:num('work',1,3600),rest:Math.min(3600,Math.max(0,Number($('rest').value)||0)),sets:num('sets',1,99)}}function save(){localStorage.setItem('gym-timer-v1',JSON.stringify(Object.fromEntries(ids.map(x=>[x,$(x).type==='checkbox'?$(x).checked:$(x).value]))))}try{let s=JSON.parse(localStorage.getItem('gym-timer-v1')||'{}');ids.forEach(id=>{if(s[id]!==undefined){if($(id).type==='checkbox')$(id).checked=!!s[id];else $(id).value=s[id]}})}catch{}function sound(freq=880,dur=.13){if(!$('sound').checked)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(num('volume',0,100)/100*.2,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch{}}function chime(){sound(1047,.17);setTimeout(()=>sound(1319,.28),200)}function render(){const c=config();$('phase').textContent=phase==='ready'?'READY':phase==='work'?'トレーニング':phase==='rest'?'休憩':'COMPLETE';$('phase').style.color=phase==='rest'?'#6bbaff':'#ff8b25';$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('current').textContent=set;$('total').textContent=c.sets;$('start').textContent=running?'Ⅱ 一時停止':phase==='ready'||phase==='done'?'▶ スタート':'▶ 再開';$('status').textContent=phase==='done'?'🎉 全セット完了！':phase==='ready'?'スタートを押して開始':(running?'進行中':'一時停止中')+' · '+(phase==='work'?'運動':'休憩')+' · '+set+' / '+c.sets+' セット';let total=phase==='rest'?c.rest:c.work;let pct=phase==='done'?100:phase==='ready'?100:Math.max(0,remaining/Math.max(1,total)*100);$('dial').style.setProperty('--progress',pct+'%')}function stop(){running=false;clearInterval(interval);interval=null;if(wake){wake.release().catch(()=>{});wake=null}}async function keepAwake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch{}}function reset(){stop();phase='ready';set=1;remaining=config().work;prev=null;render()}function next(){const c=config();prev=null;if(phase==='work'){if(set>=c.sets){phase='done';remaining=0;stop();chime();setTimeout(chime,550);render();return}if(c.rest>0){phase='rest';remaining=c.rest}else{set++;phase='work';remaining=c.work}chime()}else if(phase==='rest'){set++;phase='work';remaining=c.work;chime()}else return;deadline=Date.now()+remaining*1000;render()}function tick(){if(!running)return;let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n!==remaining){remaining=n;if(n<=3&&n>0&&prev!==n&&$('countdown').checked)sound(700,.09);prev=n;render()}if(Date.now()>=deadline){next();if(running)deadline=Date.now()+remaining*1000}}function start(){if(phase==='done')reset();if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();render();return}if(phase==='ready'){phase='work';set=1;remaining=config().work;chime()}else sound(900,.1);running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,100);keepAwake();render()}$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('skip').addEventListener('click',()=>{if(phase==='ready'||phase==='done')return;next()});ids.forEach(id=>$(id).addEventListener('change',()=>{save();if(['work','rest','sets'].includes(id)&&!running)reset()}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){tick();keepAwake()}});reset()})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
