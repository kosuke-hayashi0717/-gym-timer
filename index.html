</style></head><body><main class="wrap"><header><h1>GYM TIMER</h1><small>TRAIN HARDER · BE STRONGER</small></header><section class="panel"><div class="label">⚙ トレーニング設定</div><div class="settings" style="margin-top:14px"><label class="field"><small>運動時間（秒）</small><input id="work" type="number" min="1" max="3600" value="40" inputmode="numeric"></label><label class="field"><small>休憩時間（秒）</small><input id="rest" type="number" min="0" max="3600" value="20" inputmode="numeric"></label><label class="field"><small>セット数</small><input id="sets" type="number" min="1" max="99" value="5" inputmode="numeric"></label></div></section><section class="dial" id="dial"><div class="dial-inner"><div class="phase" id="phase">READY</div><div class="time-frame"><svg class="time-meter" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true"><rect class="meter-track" x="10" y="10" width="980" height="400" rx="38" pathLength="100"/><rect class="meter-fill" id="timeMeterFill" x="10" y="10" width="980" height="400" rx="38" pathLength="100"/></svg><div class="time" id="time">00:40</div></div><div class="set" aria-label="現在のセット数"><span class="set-label">SET</span><b id="current">1</b><span>/</span><span id="total">5</span></div></div></section><div class="status" id="status" aria-live="polite">スタートを押して開始</div><div class="actions"><button class="btn" id="reset">↻<br>リセット</button><button class="btn primary" id="start">▶ スタート</button><button class="btn" id="skip">⏭<br>スキップ</button></div><div class="focus-bar"><button id="focus" type="button">⛶ 集中表示</button></div><section class="extra" aria-label="追加機能"><div class="panel"><div class="label">💾 プリセット</div><div class="toolrow"><button id="savePreset" type="button">現在の設定を保存</button></div><div id="presets" class="hint">保存した設定はありません</div></div></section><p class="note sound-note">🔊 開始・切り替え・終了時は通知音、残り3秒は英語音声（Three・Two・One）が鳴ります。音量はスマホ本体の音量ボタンで調整してください。※ iPhoneの消音モードや画面ロック中は音が鳴らない場合があります。</p><footer>Ver 4.6.0</footer></main><script>
(()=>{const $=id=>document.getElementById(id),ids=['work','rest','sets'];let phase='ready',set=1,remaining=40,deadline=0,interval=null,running=false,ctx=null,prev=null,wake=null;const num=(id,min,max)=>Math.min(max,Math.max(min,Number($(id).value)||min));function config(){return{work:num('work',1,3600),rest:Math.min(3600,Math.max(0,Number($('rest').value)||0)),sets:num('sets',1,99)}}function save(){localStorage.setItem('gym-timer-v1',JSON.stringify(Object.fromEntries(ids.map(x=>[x,$(x).value]))))}try{let s=JSON.parse(localStorage.getItem('gym-timer-v1')||'{}');ids.forEach(id=>{if(s[id]!==undefined){$(id).value=s[id]}})}catch{}function sound(freq=1850,dur=.4){
 try{

}
const countdownAudio={};for(const [n,word] of [[3,'three'],[2,'two'],[1,'one']]){const a=new Audio('./'+word+'.mp3');a.preload='auto';countdownAudio[n]=a}let femaleVoice=null;

function fallbackCount(n){const a=countdownAudio[n];if(!a)return;try{a.pause();a.currentTime=0;a.volume=1;a.play().catch(()=>sound(1050,.15))}catch{sound(1050,.15)}}function chime(){sound(1950,.52)}function updateMotion(){}function render(){updateMotion();const c=config();$('phase').textContent=phase==='ready'?'READY':phase==='work'?'トレーニング':phase==='rest'?'休憩':'COMPLETE';$('phase').style.color=phase==='rest'?'#6bbaff':'#ff8b25';$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('current').textContent=set;$('total').textContent=c.sets;$('start').textContent=running?'Ⅱ 一時停止':phase==='ready'||phase==='done'?'▶ スタート':'▶ 再開';$('status').textContent=phase==='done'?'🎉 全セット完了！':phase==='ready'?'スタートを押して開始':(running?'進行中':'一時停止中')+' · '+(phase==='work'?'運動':'休憩')+' · '+set+' / '+c.sets+' セット';document.body.classList.toggle('is-rest',phase==='rest');document.body.classList.toggle('is-work',phase==='work');let total=phase==='rest'?c.rest:c.work;let pct=phase==='done'?0:phase==='ready'?100:Math.max(0,Math.min(100,remaining/Math.max(1,total)*100));$('dial').style.setProperty('--progress',pct+'%');$('timeMeterFill').style.setProperty('stroke-dasharray',`${pct} ${100-pct}`,'important');$('timeMeterFill').style.strokeDashoffset='0';}function stop(){if('speechSynthesis' in window)speechSynthesis.cancel();running=false;clearInterval(interval);interval=null;if(wake){wake.release().catch(()=>{});wake=null}}async function keepAwake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch{}}function reset(){stop();phase='ready';set=1;remaining=config().work;prev=null;render()}function next(){if('speechSynthesis' in window)speechSynthesis.cancel();const c=config();prev=null;if(phase==='work'){if(set>=c.sets){phase='done';remaining=0;stop();flash();chime();setTimeout(chime,550);render();return}if(c.rest>0){phase='rest';remaining=c.rest}else{set++;phase='work';remaining=c.work}chime();flash()}else if(phase==='rest'){set++;phase='work';remaining=c.work;chime();flash()}else return;deadline=Date.now()+remaining*1000;render()}function tick(){if(!running)return;let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n!==remaining){remaining=n;if(n<=3&&n>0&&prev!==n){sayCount(n);if(n===1)flash()}prev=n;render()}if(Date.now()>=deadline){next();if(running)deadline=Date.now()+remaining*1000}}function start(){chooseVoice();for(const a of Object.values(countdownAudio)){a.load()}if(phase==='done')reset();if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();render();return}if(phase==='ready'){phase='work';set=1;remaining=config().work;chime()}else sound(1950,.24);running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,100);keepAwake();render()}

// 横向きでは自動集中表示。縦向きではユーザーが選んだ表示に戻す。

function createRow(container,txt,buttons){const row=document.createElement('div');row.className='preset-item';const label=document.createElement('span');label.textContent=txt;row.append(label);for(const [title,fn] of buttons){const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=fn;row.append(b)}container.append(row)}
