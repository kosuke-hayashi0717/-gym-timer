:root{font-family:system-ui,-apple-system,sans-serif;color:#f3f5f8;background:#090c11}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#202630,#090c11 65%);min-height:100dvh}.wrap{max-width:560px;margin:auto;padding:22px 18px 38px}header{text-align:center;margin-bottom:22px}h1{font-size:clamp(26px,8vw,38px);letter-spacing:.1em;margin:0;font-weight:900;text-shadow:0 2px 12px #000}header small{color:#87909e;letter-spacing:.24em;font-size:10px}.panel{background:linear-gradient(145deg,#1c222b,#10151c);border:1px solid #333d49;border-radius:20px;padding:18px;box-shadow:inset 0 1px #ffffff15,0 10px 25px #0005;margin-bottom:17px}.label{color:#aab3c0;font-size:13px;font-weight:700;letter-spacing:.08em}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{min-width:0}.field input{margin-top:8px;width:100%;background:#090d13;color:white;border:1px solid #45505d;border-radius:10px;padding:12px 5px;text-align:center;font-size:23px;font-weight:800;outline:none}.field input:focus{border-color:#ff861d}.field small{font-size:10px;color:#818b99}.dial{width:min(85vw,390px);aspect-ratio:1;border-radius:50%;margin:25px auto 20px;padding:14px;background:conic-gradient(#ff7b10 var(--progress,100%),#313b48 0);box-shadow:0 0 35px #ff730018,0 15px 30px #0008;transition:background .2s linear}.dial-inner{height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#18202a,#080b10 70%);border:10px solid #0d1218;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase{font-weight:900;color:#ff8b25;font-size:clamp(18px,5vw,26px)}.time{font-size:clamp(65px,17vw,92px);letter-spacing:-.055em;line-height:1.2;font-weight:900;font-variant-numeric:tabular-nums}.set{display:flex;align-items:baseline;justify-content:center;gap:9px;color:#f1f3f6;font-weight:900;font-size:clamp(26px,7vw,38px);line-height:1.1;white-space:nowrap;text-shadow:0 2px 10px #0008}.set b{color:#ff851b;font-size:clamp(54px,15vw,78px);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 22px #ff7b1040}.set #total{font-size:clamp(36px,10vw,50px);color:#f4f6f9}.set-label{font-size:clamp(17px,4.5vw,24px);color:#aeb8c6;letter-spacing:.06em}.status{text-align:center;color:#a8b1bc;font-size:13px;margin-bottom:20px;min-height:20px}.actions{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}.btn{border:1px solid #46515d;border-radius:15px;min-height:64px;background:linear-gradient(#252d37,#131920);color:#f6f7f9;font-size:15px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(#ff9b25,#e24b00);border-color:#ffae55;color:#fff;box-shadow:0 6px 20px #ff5b003d;font-size:19px}.btn:active{transform:scale(.98)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;color:#bdc5d0;font-size:14px}.row input[type=checkbox]{accent-color:#ff821a;width:21px;height:21px}.row input[type=range]{accent-color:#ff821a;width:140px}.note{font-size:12px;color:#86909e;line-height:1.65;margin-top:15px}footer{text-align:center;color:#5e6977;font-size:11px;margin-top:20px}

.extra{max-width:560px;margin:0 auto 16px}.extra .panel{margin-bottom:12px}.toolrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.toolrow button,.preset-item button{background:#242e3a;border:1px solid #485666;border-radius:11px;color:#fff;padding:11px 14px;min-height:44px;font-weight:800;cursor:pointer}.toolrow button:active{background:#ff841b}.preset-item{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333d49}.preset-item span{font-size:13px;color:#cbd4df;overflow-wrap:anywhere}.preset-item button{padding:8px 11px;min-height:40px}.hint{color:#aeb8c6;font-size:12px;margin:8px 0}.flash{animation:flashFrame .38s ease-in-out 2}@keyframes flashFrame{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 14px #ff861caa}}@media(prefers-reduced-motion:reduce){.flash{animation:none;outline:4px solid #ff861c}}body.focus-mode .wrap>header,body.focus-mode .wrap>.panel,body.focus-mode .wrap>.sound-note,body.focus-mode .wrap>footer{display:none}body.focus-mode .wrap{max-width:900px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px}body.focus-mode .dial{width:min(72dvh,85vw,560px);margin:0 auto}body.focus-mode .actions{width:min(90vw,540px);margin:auto}body.focus-mode .status{margin:0}body.focus-mode .extra{width:min(90vw,540px);margin:0 auto}body.focus-mode .extra .panel:not(.focus-tools){display:none}body.focus-mode .focus-tools{padding:8px 12px;margin:0}body.focus-mode .focus-tools .label{display:none}body.focus-mode .toolrow{margin:0;justify-content:center}body.focus-mode .time{font-size:clamp(55px,12vw,112px)}@media(orientation:landscape){.extra{max-width:1100px}body.focus-mode .wrap{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:'dial actions' 'dial tools';align-items:center;gap:8px}body.focus-mode .dial{grid-area:dial;width:min(80dvh,46vw,550px)}body.focus-mode .actions{grid-area:actions;width:100%}body.focus-mode .extra{grid-area:tools;width:100%}body.focus-mode .status{display:none}}@media(orientation:landscape) and (min-width:600px){body:not(.focus-mode) .extra{padding:0 16px}.toolrow button{font-size:13px}}

</style></head><body><main class="wrap"><header><h1>GYM TIMER</h1><small>TRAIN HARDER · BE STRONGER</small></header><section class="panel"><div class="label">⚙ トレーニング設定</div><div class="settings" style="margin-top:14px"><label class="field"><small>運動時間（秒）</small><input id="work" type="number" min="1" max="3600" value="40" inputmode="numeric"></label><label class="field"><small>休憩時間（秒）</small><input id="rest" type="number" min="0" max="3600" value="20" inputmode="numeric"></label><label class="field"><small>セット数</small><input id="sets" type="number" min="1" max="99" value="5" inputmode="numeric"></label></div></section><section class="dial" id="dial"><div class="dial-inner"><div class="phase" id="phase">READY</div><div class="time" id="time">00:40</div><div class="set" aria-label="現在のセット数"><span class="set-label">SET</span><b id="current">1</b><span>/</span><span id="total">5</span></div></div></section><div class="status" id="status" aria-live="polite">スタートを押して開始</div><div class="actions"><button class="btn" id="reset">↻<br>リセット</button><button class="btn primary" id="start">▶ スタート</button><button class="btn" id="skip">⏭<br>スキップ</button></div><section class="extra" aria-label="追加機能"><div class="panel focus-tools"><div class="label">⚡ クイック操作</div><div class="toolrow"><button id="add10" type="button">＋10秒</button><button id="add30" type="button">＋30秒</button><button id="focus" type="button">⛶ 集中表示</button></div><p class="hint" id="wakeState">画面スリープ防止：待機中</p></div><div class="panel"><div class="label">💾 プリセット</div><div class="toolrow"><button id="savePreset" type="button">現在の設定を保存</button></div><div id="presets" class="hint">保存した設定はありません</div></div><div class="panel"><div class="label">📊 トレーニング履歴</div><div class="toolrow"><button id="clearHistory" type="button">履歴を削除</button></div><div id="history" class="hint">まだ履歴はありません</div></div></section><p class="note sound-note">🔊 開始・切り替え・終了時と残り3秒に通知音が鳴ります。音量はスマホ本体の音量ボタンで調整してください。※ iPhoneの消音モードや画面ロック中は音が鳴らない場合があります。</p><footer>GYM TIMER · Ver 3.1.0 · PWA</footer></main><script>
(()=>{const $=id=>document.getElementById(id),ids=['work','rest','sets'];let phase='ready',set=1,remaining=40,deadline=0,interval=null,running=false,ctx=null,prev=null,wake=null,sessionStarted=null,completedLogged=false;const num=(id,min,max)=>Math.min(max,Math.max(min,Number($(id).value)||min));function config(){return{work:num('work',1,3600),rest:Math.min(3600,Math.max(0,Number($('rest').value)||0)),sets:num('sets',1,99)}}function save(){localStorage.setItem('gym-timer-v1',JSON.stringify(Object.fromEntries(ids.map(x=>[x,$(x).value]))))}try{let s=JSON.parse(localStorage.getItem('gym-timer-v1')||'{}');ids.forEach(id=>{if(s[id]!==undefined){$(id).value=s[id]}})}catch{}function sound(freq=880,dur=.13){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch{}}function chime(){sound(1047,.17);setTimeout(()=>sound(1319,.28),200)}function render(){const c=config();$('phase').textContent=phase==='ready'?'READY':phase==='work'?'トレーニング':phase==='rest'?'休憩':'COMPLETE';$('phase').style.color=phase==='rest'?'#6bbaff':'#ff8b25';$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('current').textContent=set;$('total').textContent=c.sets;$('start').textContent=running?'Ⅱ 一時停止':phase==='ready'||phase==='done'?'▶ スタート':'▶ 再開';$('status').textContent=phase==='done'?'🎉 全セット完了！':phase==='ready'?'スタートを押して開始':(running?'進行中':'一時停止中')+' · '+(phase==='work'?'運動':'休憩')+' · '+set+' / '+c.sets+' セット';let total=phase==='rest'?c.rest:c.work;let pct=phase==='done'?100:phase==='ready'?100:Math.max(0,remaining/Math.max(1,total)*100);$('dial').style.setProperty('--progress',pct+'%')}function stop(){running=false;clearInterval(interval);interval=null;if(wake){wake.release().catch(()=>{});wake=null}updateWake()}async function keepAwake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen');updateWake()}catch{updateWake()}}function reset(){stop();phase='ready';set=1;remaining=config().work;prev=null;sessionStarted=null;completedLogged=false;render()}function next(){const c=config();prev=null;if(phase==='work'){if(set>=c.sets){phase='done';remaining=0;stop();recordCompletion();flash();chime();setTimeout(chime,550);render();return}if(c.rest>0){phase='rest';remaining=c.rest}else{set++;phase='work';remaining=c.work}chime();flash()}else if(phase==='rest'){set++;phase='work';remaining=c.work;chime();flash()}else return;deadline=Date.now()+remaining*1000;render()}function tick(){if(!running)return;let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n!==remaining){remaining=n;if(n<=3&&n>0&&prev!==n){sound(700,.09);if(n===1)flash()}prev=n;render()}if(Date.now()>=deadline){next();if(running)deadline=Date.now()+remaining*1000}}function start(){if(phase==='done')reset();if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();render();return}if(phase==='ready'){phase='work';set=1;remaining=config().work;sessionStarted=Date.now();completedLogged=false;chime()}else sound(900,.1);running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,100);keepAwake();render()}
function flash(){document.body.classList.remove('flash');void document.body.offsetWidth;document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),850)}
function updateWake(){const el=$('wakeState');if(el)el.textContent=running?(wake?'画面スリープ防止：有効':'画面スリープ防止：端末の制限により利用不可'):'画面スリープ防止：待機中'}
function addSeconds(n){if(phase==='ready'||phase==='done')return;remaining=Math.min(7200,remaining+n);if(running)deadline=Date.now()+remaining*1000;render()}
$('add10').onclick=()=>addSeconds(10);$('add30').onclick=()=>addSeconds(30);
$('focus').onclick=()=>{document.body.classList.toggle('focus-mode');$('focus').textContent=document.body.classList.contains('focus-mode')?'⛶ 通常表示':'⛶ 集中表示'};
const storage=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};
function safeSave(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}
function createRow(container,txt,buttons){const row=document.createElement('div');row.className='preset-item';const label=document.createElement('span');label.textContent=txt;row.append(label);for(const [title,fn] of buttons){const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=fn;row.append(b)}container.append(row)}
function drawPresets(){const root=$('presets');root.replaceChildren();const data=storage('gym-timer-presets-v3');if(!data.length){root.textContent='保存した設定はありません';return}data.forEach((p,i)=>createRow(root,`${p.name}｜運動${p.work}秒・休憩${p.rest}秒・${p.sets}セット`,[['適用',()=>{if(running){alert('タイマーを停止してから適用してな');return}for(const id of ids)$(id).value=p[id];save();reset()}],['削除',()=>{const next=storage('gym-timer-presets-v3');next.splice(i,1);safeSave('gym-timer-presets-v3',next);drawPresets()}]]))}
$('savePreset').onclick=()=>{const data=storage('gym-timer-presets-v3');if(data.length>=12){alert('プリセットは最大12件までやで');return}const name=prompt('プリセット名（例：HIIT）','筋トレ');if(name===null)return;data.push({...config(),name:name.trim().slice(0,24)||'マイ設定'});safeSave('gym-timer-presets-v3',data);drawPresets()};
function drawHistory(){const root=$('history');root.replaceChildren();const data=storage('gym-timer-history-v3');if(!data.length){root.textContent='まだ履歴はありません';return}data.forEach(h=>createRow(root,`${new Date(h.date).toLocaleString('ja-JP')}｜${h.sets}セット・運動${h.work}秒・休憩${h.rest}秒`,[]))}
function recordCompletion(){if(completedLogged)return;completedLogged=true;const data=storage('gym-timer-history-v3');data.unshift({...config(),date:new Date().toISOString(),elapsedSeconds:sessionStarted?Math.round((Date.now()-sessionStarted)/1000):0});safeSave('gym-timer-history-v3',data.slice(0,50));drawHistory()}
$('clearHistory').onclick=()=>{if(confirm('トレーニング履歴をすべて削除する？')){safeSave('gym-timer-history-v3',[]);drawHistory()}};
drawPresets();drawHistory();updateWake();
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('skip').addEventListener('click',()=>{if(phase==='ready'||phase==='done')return;next()});ids.forEach(id=>$(id).addEventListener('change',()=>{save();if(['work','rest','sets'].includes(id)&&!running)reset()}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){tick();keepAwake()}});reset()})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
