(()=>{const $=id=>document.getElementById(id),ids=['work','rest','sets'];let phase='ready',set=1,remaining=40,deadline=0,interval=null,running=false,ctx=null,prev=null,wake=null;const num=(id,min,max)=>Math.min(max,Math.max(min,Number($(id).value)||min));function config(){return{work:num('work',1,3600),rest:Math.min(3600,Math.max(0,Number($('rest').value)||0)),sets:num('sets',1,99)}}function save(){localStorage.setItem('gym-timer-v1',JSON.stringify(Object.fromEntries(ids.map(x=>[x,$(x).value]))))}try{let s=JSON.parse(localStorage.getItem('gym-timer-v1')||'{}');ids.forEach(id=>{if(s[id]!==undefined){$(id).value=s[id]}})}catch{}function sound(freq=880,dur=.13){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}catch{}}const countdownAudio={};for(const [n,word] of [[3,'three'],[2,'two'],[1,'one']]){const a=new Audio('./'+word+'.mp3');a.preload='auto';countdownAudio[n]=a}function sayCount(n){const a=countdownAudio[n];if(!a)return;try{a.pause();a.currentTime=0;a.volume=1;const playPromise=a.play();if(playPromise)playPromise.catch(()=>sound(1050,.15))}catch{sound(1050,.15)}}function chime(){sound(1047,.17);setTimeout(()=>sound(1319,.28),200)}function updateMotion(){}function render(){updateMotion();const c=config();$('phase').textContent=phase==='ready'?'READY':phase==='work'?'トレーニング':phase==='rest'?'休憩':'COMPLETE';$('phase').style.color=phase==='rest'?'#6bbaff':'#ff8b25';$('time').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('current').textContent=set;$('total').textContent=c.sets;$('start').textContent=running?'Ⅱ 一時停止':phase==='ready'||phase==='done'?'▶ スタート':'▶ 再開';$('status').textContent=phase==='done'?'🎉 全セット完了！':phase==='ready'?'スタートを押して開始':(running?'進行中':'一時停止中')+' · '+(phase==='work'?'運動':'休憩')+' · '+set+' / '+c.sets+' セット';document.body.classList.toggle('is-rest',phase==='rest');document.body.classList.toggle('is-work',phase==='work');let total=phase==='rest'?c.rest:c.work;let pct=phase==='done'?100:phase==='ready'?100:Math.max(0,remaining/Math.max(1,total)*100);$('dial').style.setProperty('--progress',pct+'%')}function stop(){running=false;clearInterval(interval);interval=null;if(wake){wake.release().catch(()=>{});wake=null}}async function keepAwake(){try{if('wakeLock'in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch{}}function reset(){stop();phase='ready';set=1;remaining=config().work;prev=null;render()}function next(){const c=config();prev=null;if(phase==='work'){if(set>=c.sets){phase='done';remaining=0;stop();flash();chime();setTimeout(chime,550);render();return}if(c.rest>0){phase='rest';remaining=c.rest}else{set++;phase='work';remaining=c.work}chime();flash()}else if(phase==='rest'){set++;phase='work';remaining=c.work;chime();flash()}else return;deadline=Date.now()+remaining*1000;render()}function tick(){if(!running)return;let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n!==remaining){remaining=n;if(n<=3&&n>0&&prev!==n){sayCount(n);if(n===1)flash()}prev=n;render()}if(Date.now()>=deadline){next();if(running)deadline=Date.now()+remaining*1000}}function start(){for(const a of Object.values(countdownAudio)){a.load()}if(phase==='done')reset();if(running){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();render();return}if(phase==='ready'){phase='work';set=1;remaining=config().work;chime()}else sound(900,.1);running=true;deadline=Date.now()+remaining*1000;interval=setInterval(tick,100);keepAwake();render()}
function flash(){document.body.classList.remove('flash');void document.body.offsetWidth;document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),850)}
// 横向きでは自動集中表示。縦向きではユーザーが選んだ表示に戻す。
let portraitFocus=false;
function isLandscape(){return window.matchMedia('(orientation: landscape)').matches}
function syncFocus(){
 const landscape=isLandscape();
 document.body.classList.toggle('focus-mode',landscape||portraitFocus);
 $('focus').textContent=landscape?'⛶ 横画面：集中表示中':portraitFocus?'⛶ 通常表示':'⛶ 集中表示';
 $('focus').disabled=landscape;
 $('focus').setAttribute('aria-disabled',String(landscape));
}
$('focus').onclick=()=>{if(isLandscape())return;portraitFocus=!portraitFocus;syncFocus()};
window.addEventListener('orientationchange',syncFocus);
window.addEventListener('resize',syncFocus);
syncFocus();
const storage=(key)=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};
function safeSave(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch{}}
function createRow(container,txt,buttons){const row=document.createElement('div');row.className='preset-item';const label=document.createElement('span');label.textContent=txt;row.append(label);for(const [title,fn] of buttons){const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=fn;row.append(b)}container.append(row)}
function drawPresets(){const root=$('presets');root.replaceChildren();const data=storage('gym-timer-presets-v3');if(!data.length){root.textContent='保存した設定はありません';return}data.forEach((p,i)=>createRow(root,`${p.name}｜運動${p.work}秒・休憩${p.rest}秒・${p.sets}セット`,[['適用',()=>{if(running){alert('タイマーを停止してから適用してな');return}for(const id of ids)$(id).value=p[id];save();reset()}],['削除',()=>{const next=storage('gym-timer-presets-v3');next.splice(i,1);safeSave('gym-timer-presets-v3',next);drawPresets()}]]))}
$('savePreset').onclick=()=>{const data=storage('gym-timer-presets-v3');if(data.length>=12){alert('プリセットは最大12件までやで');return}const name=prompt('プリセット名（例：HIIT）','筋トレ');if(name===null)return;data.push({...config(),name:name.trim().slice(0,24)||'マイ設定'});safeSave('gym-timer-presets-v3',data);drawPresets()};
drawPresets();
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('skip').addEventListener('click',()=>{if(phase==='ready'||phase==='done')return;next()});ids.forEach(id=>$(id).addEventListener('change',()=>{save();if(['work','rest','sets'].includes(id)&&!running)reset()}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){tick();keepAwake()}});reset()})();
</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
